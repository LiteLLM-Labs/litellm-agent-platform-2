name: Rust checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  code-checks:
    name: Compile, lint, and size checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lap_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lap_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lap_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check Rust compile
        run: cargo check --all-targets --locked

      - name: Lint with Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Reset test database
        run: psql postgres://postgres:postgres@127.0.0.1:5432/lap_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

      - name: Run tests
        run: cargo test --locked

      - name: Enforce code size limits
        run: python3 scripts/check_code_size.py
